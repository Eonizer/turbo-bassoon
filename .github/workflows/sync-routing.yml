name: Sync routing

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull upstream and swap remote DNS to Quad9
        run: |
          set -euo pipefail
          mkdir -p HAPP
          curl -fsSL https://raw.githubusercontent.com/hydraponique/roscomvpn-routing/refs/heads/main/HAPP/DEFAULT.JSON \
            | jq '.RemoteDNSDomain = "https://1.1.1.1/dns-query"
                  | .RemoteDNSIP = "1.1.1.1"
                  | .LastUpdated = (.LastUpdated | tonumber + 1)' \
            > HAPP/DEFAULT.JSON
          printf 'happ://routing/add/%s' "$(base64 -w0 HAPP/DEFAULT.JSON)" > HAPP/DEFAULT.DEEPLINK

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP
          git diff --cached --quiet || { git commit -m "Sync routing from upstream"; git push; }
